name: "Generator of Podcases"
author: "Balakarthik Radhakrishnan"
description: "Generates itunes xml file content whenever the podcast yaml is updated in any podcast repo"
runs: 
  using: "docker"
  image: "Dockerfile.podgen"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "The committer's emails"
    required: True
    default: ${{ github.actor }}@localhost
  name:
    description: "The committer's name"
    required: True
    default: ${{ github.actor }}